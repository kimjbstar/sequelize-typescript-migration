name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  # Every job installs dependencies, which triggers the `prepare` script. Husky has no
  # business running in CI, and this makes that script a no-op there.
  HUSKY: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      # One Node version failing should not hide the result on the others.
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # eslint-config-prettier only turns formatting rules off, so this is the only
      # thing that actually enforces the format.
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Coverage summary
        if: matrix.node-version == 22
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run test:coverage -- --coverageReporters=text-summary --silent 2>&1 \
            | grep -A6 "Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows-smoke:
    # writeMigration builds paths with path.join and writes files; this catches a
    # separator regression that Linux would never surface.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  integration:
    # Covers what sqlite cannot: dialect-specific type rendering and, above all,
    # Postgres identifier folding -- the cause of the most reported issue with this tool.
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: test_migration
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        # postgis rather than plain postgres: the GEOMETRY and GEOGRAPHY branches of the
        # type reverser need the extension to be installable.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: test_migration
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Service containers publish on the default ports. test/docker-compose.yml
      # offsets them locally so it never collides with a developer's own servers,
      # which is why these values are set explicitly rather than defaulted.
      - run: npm run test:integration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_root_password
          MYSQL_DATABASE: test_migration
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DATABASE: test_migration

  sequelize-compat:
    # sequelize-typescript v2 declares `sequelize: >=6.20.1`, so both ends of that range
    # have to keep working. This is also the early warning for the internals the adapter
    # layer reads.
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        sequelize-version: ['6.20.1', '6.37.8']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save sequelize@${{ matrix.sequelize-version }}
      - run: npm test

  packaging:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:package
      - run: npm run verify:packed
